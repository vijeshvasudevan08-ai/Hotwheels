<!DOCTYPE html>
<html lang="en">
<head>
 <style>
 body {
 font-family: Arial, sans-serif;
 margin: 40px;
 background: #fcb4b4; }
 .container {
 max-width: 600px;
 margin: auto;
 padding: 20px;
 background: #e6c2f7;
 border-radius: 10px;
 box-shadow: 0 0 10px rgba(0,0,0,0.1); }
 h2 {
 text-align: center; }
 .bill-item {
 display: flex;
 justify-content: space-between;
 margin: 10px 0; }
 .total {
 font-weight: bold;
 font-size: 1.2em;
 border-top: 1px solid #000;
 padding-top: 10px;
 margin-top: 20px; }
 button {
 width: 100%;
 padding: 10px;
 margin: 8px 0;
 border-radius: 6px;
 border: 1px solid #ff0000;
 background: #007bff;
 color: white;
 border: none;
 cursor: pointer; }
button:hover {
 background: #0056b3; }
 </style></head>
<body>
 <div class="container">
 <h2>HOTWHEELS BILL</h2>
 <div class="bill">
  {% for result in results %}
  <div class="bill-cars">
   <span>{{ result.cars }}</span>
   <span>₹{{ result.price }}</span>
  </div>
  {% endfor %}
  <div class="bill-cars total">
   <span>Total</span>
   <span>₹{{ total }}</span>
  </div>
 </div>
 <button onclick="window.location.href='/Hotwheels'">Order Again</button>
 </div>
</body>
</html>
